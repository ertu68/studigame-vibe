{{define "content"}}
<section>
    <h1>{{.SiteName}}</h1>
    <p>Bald verfuegbar: {{.SiteName}} — inspiriert vom Kult-Browsergame Pennergame (2007),
       aber kein offizielles Nachfolgeprojekt und ohne Verbindung zu Farbflut Entertainment.</p>

    <div id="waitlist-form">
        <form hx-post="/waitlist" hx-target="#waitlist-form" hx-swap="outerHTML">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" required placeholder="du@beispiel.de">
            <button type="submit">Auf die Warteliste</button>
        </form>
    </div>
</section>
{{end}}
