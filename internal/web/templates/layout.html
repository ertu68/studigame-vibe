{{define "layout"}}
<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    {{if .MetaRefresh}}
    <!-- Reloads once when a running action is due, instead of polling for it. -->
    <meta http-equiv="refresh" content="{{.MetaRefresh}}" />
    {{end}}
    <title>{{.SiteName}}{{if .Title}} — {{.Title}}{{end}}</title>
    <!-- Blocks paint until the theme is applied to avoid a flash. -->
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/htmx.min.js"></script>
    <script defer src="/static/js/alpine.min.js"></script>
    <link rel="stylesheet" href="/static/css/app.css" />
  </head>
  <body class="min-h-screen flex flex-col bg-bg text-ink font-body pb-16">
    <!-- Status bar -->
    {{if .User}} {{template "statusbar" .}} {{end}}

    <main class="flex-grow container mx-auto px-4 py-6">
      <!-- Flash messages -->
      {{template "flash" .}} {{template "content" .}}
    </main>

    <!-- Bottom navigation for mobile -->
    {{if .User}} {{template "bottom_nav" .}} {{end}}
  </body>
</html>
{{end}}
