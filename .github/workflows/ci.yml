name: Conventions

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check branch name and pull request title
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-conventions.sh "$BRANCH_NAME" "$PULL_REQUEST_TITLE"
