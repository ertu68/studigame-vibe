name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.27.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{env.GO_VERSION}}
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run CI checks
        run: make ci

      - name: Build
        run: make build