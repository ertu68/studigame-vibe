{{define "form_field"}}
<div class="form-field {{.Class}}" {{if .ID}}id="{{.ID}}" {{end}}>
  {{if .Label}}
  <label for="{{.Name}}" class="form-label">{{.Label}}</label>
  {{end}} {{if eq .Type "textarea"}}
  <textarea
    name="{{.Name}}"
    id="{{.Name}}"
    class="form-input"
    {{if
    .Required}}required{{end}}
    {{if
    .Placeholder}}placeholder="{{.Placeholder}}"
    {{end}}
    {{if
    .Rows}}rows="{{.Rows}}"
    {{else}}rows="3"
    {{end}}
  >
{{.Value}}</textarea>
  {{else if eq .Type "select"}}
  <select
    name="{{.Name}}"
    id="{{.Name}}"
    class="form-input"
    {{if
    .Required}}required{{end}}
  >
    {{range .Options}}
    <option value="{{.Value}}" {{if eq $.Value .Value}}selected{{end}}>
      {{.Label}}
    </option>
    {{end}}
  </select>
  {{else}}
  <input
    type="{{if .Type}}{{.Type}}{{else}}text{{end}}"
    name="{{.Name}}"
    id="{{.Name}}"
    class="form-input"
    {{if
    .Required}}required{{end}}
    {{if
    .Placeholder}}placeholder="{{.Placeholder}}"
    {{end}}
    {{if
    .Value}}value="{{.Value}}"
    {{end}}
    {{if
    .Min}}min="{{.Min}}"
    {{end}}
    {{if
    .Max}}max="{{.Max}}"
    {{end}}
  />
  {{end}} {{if .Help}}
  <p class="text-sm text-soft mt-1">{{.Help}}</p>
  {{end}}
</div>
{{end}}
