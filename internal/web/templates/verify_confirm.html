{{define "content"}}
<div class="max-w-md mx-auto py-12">
  <div class="card">
    <h1 class="text-2xl font-display text-ink mb-6">
      {{if .Success}}Bestätigung erfolgreich{{else}}Fehler{{end}}
    </h1>

    {{if .Success}}
    <div class="flash-success mb-6">
      <p>Dein Konto ist jetzt aktiviert!</p>
      <p class="mt-2">Du kannst dich jetzt einloggen.</p>
    </div>

    <div class="text-center mt-6">
      <a href="/login" class="btn-primary">Zum Login</a>
    </div>
    {{else}}
    <div class="flash-error mb-6">
      <p>{{.Error}}</p>
    </div>

    <div class="text-center mt-6">
      <a href="/register" class="btn-secondary">Noch mal registrieren</a>
    </div>
    {{end}}
  </div>
</div>
{{end}}
