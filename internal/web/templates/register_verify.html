{{define "content"}}
<div class="max-w-md mx-auto py-12">
  <div class="card">
    <h1 class="text-2xl font-display text-ink mb-6">E-Mail bestätigen</h1>

    <div class="flash-success mb-6">
      <p>Bestätigungslink wurde an <strong>{{.Email}}</strong> gesendet.</p>
      <p class="mt-2">Klick auf den Link in der E-Mail, um dein Konto zu aktivieren.</p>
    </div>

    <div class="text-center text-sm text-soft">
      <p>Link kam nicht an? Überprüfe deinen Spam-Ordner.</p>
    </div>

    <form method="post" action="/verify/resend" class="mt-6 text-center">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}" />
      <input type="hidden" name="email" value="{{.Email}}" />
      <button type="submit" class="text-primary hover:text-primary-hover">Link erneut senden</button>
    </form>

    <div class="mt-6 text-center">
      <p>
        <a href="/login" class="text-primary hover:text-primary-hover">
          → Zum Login
        </a>
      </p>
    </div>
  </div>
</div>
{{end}}
